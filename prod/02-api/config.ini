# Refresh Desk pipeline settings (UTF-8)
# Copy the settings you need to config.local.ini beside this file. Keep the section names.
# Priority: environment variable, config.local.ini, config.ini, Python default.
# The active [prod] or [dev] section takes precedence over [common] within each file.
# Relative paths resolve from the pipeline repo root, regardless of where you launch.
# The folder names in src/<env>/02-api or <env>/02-api identify the environment.
# Restart the pipeline after an edit.
#
# Dev pilot beside the legacy scheduler: in config.local.ini set RUNNER_URL under
# [common] to http://127.0.0.1:9101 in each deployed 02-api folder.
# Keep CONTENTGEN_API_URL at port 9100 for the legacy page during the pilot.
# Set DATAPIPELINE_CONFIG_FILE in the launch environment to select a different INI.
# This lets both pipeline processes share one override file.

[common]
# Environment selection. Usually inferred from the parent of 02-api. Use prod or dev.
# Put ENV_NAME here or in the launch environment if the folder has a different name.
# ENV_NAME = dev
# The default environment folder is the one containing 02-api. If you select the
# other environment with ENV_NAME, Refresh Desk looks for that environment's 01-queries.
# DATAPIPELINE_ENV_FOLDER = src/dev

# Listener address. Use 127.0.0.1 for server-local access only.
DATAPIPELINE_HOST = 0.0.0.0
# Internal base URLs for the two pipeline APIs. Match the ports in [prod] and [dev].
PROD_API_URL = http://127.0.0.1:8000
DEV_API_URL = http://127.0.0.1:8001
# Base URL for the new ContentGen runner. Match RUNNER_PORT in the runner config.
RUNNER_URL = http://127.0.0.1:9100
# Legacy scheduler base URL and timeout in seconds. Used by the legacy page's ContentGen button.
CONTENTGEN_API_URL = http://127.0.0.1:9100
CONTENTGEN_TIMEOUT_SECONDS = 10

# Schedule and display timezone. Use an IANA name such as Asia/Kolkata.
DATAPIPELINE_TIMEZONE = Asia/Kolkata
# Optional paths. Put environment-specific overrides under [prod] or [dev].
# Schedules default to 02-api/data/schedules.json under the detected environment.
# DATAPIPELINE_SCHEDULES_FILE = src/dev/02-api/data/schedules.json
# SQL folders default to 01-queries/<source>/02-queries/01-active under the detected environment.
# DATAPIPELINE_CUSTOMER_SQL_FOLDER = src/dev/01-queries/01-customer/02-queries/01-active
# DATAPIPELINE_COLLEAGUE_SQL_FOLDER = src/dev/01-queries/02-colleague/02-queries/01-active
# Output defaults to 03-output under the environment folder.
# DATAPIPELINE_OUTPUT_FOLDER = src/dev/03-output
# Git defaults to the checkout that contains this API folder.
# DATAPIPELINE_GIT_REPO_PATH = .

# SQL Server overrides. The pipeline uses its existing server and database defaults
# when these lines are commented out. The service uses Windows integrated authentication.
# DATAPIPELINE_CUSTOMER_DB_SERVER = your-customer-sql-server
# DATAPIPELINE_CUSTOMER_DB_NAME = your-customer-database
# DATAPIPELINE_COLLEAGUE_DB_SERVER = your-colleague-sql-server
# DATAPIPELINE_COLLEAGUE_DB_NAME = your-colleague-database
# Concurrent query workers per source. Use positive integers.
DATAPIPELINE_CUSTOMER_WORKERS = 2
DATAPIPELINE_COLLEAGUE_WORKERS = 1
# Number of finished SQL jobs retained in memory. Minimum 1.
DATAPIPELINE_SQL_JOB_RETENTION_LIMIT = 200

# GitHub web URL must match the origin host. Change it for GitHub Enterprise.
DATAPIPELINE_GITHUB_URL = https://github.com
# The API URL defaults to https://api.github.com or the Enterprise host plus /api/v3.
# DATAPIPELINE_GITHUB_API_URL = https://github.example.com/api/v3
# Name of the environment variable containing the token. Supply the token in the service environment.
GITHUB_TOKEN_ENV_NAME = GITHUB_TOKEN
# Git and GitHub request timeouts in seconds.
DATAPIPELINE_GIT_TIMEOUT_SECONDS = 60
DATAPIPELINE_GITHUB_TIMEOUT_SECONDS = 10
# Commit author used for query edits. The operator's name is recorded in the commit message.
DATAPIPELINE_GIT_AUTHOR_NAME = Refresh Desk
DATAPIPELINE_GIT_AUTHOR_EMAIL = refresh-desk@users.noreply.github.com

# SQL editor size in bytes, plus connection and execution timeouts in seconds for Test query.
DATAPIPELINE_QUERY_MAX_BYTES = 262144
DATAPIPELINE_QUERY_LOGIN_TIMEOUT = 10
DATAPIPELINE_QUERY_TEST_TIMEOUT = 30
# UI request timeouts in seconds for loading the Changes tab and opening a pull request.
DATAPIPELINE_QUERY_CHANGES_API_TIMEOUT = 60
DATAPIPELINE_QUERY_PR_API_TIMEOUT = 240
# UI request timeouts in seconds for ordinary API calls and file downloads.
REFRESH_DESK_API_TIMEOUT_SECONDS = 4
REFRESH_DESK_DOWNLOAD_TIMEOUT_SECONDS = 120
# Dashboard poll intervals in milliseconds, and the number of parallel dashboard API requests.
REFRESH_DESK_ACTIVE_POLL_MS = 5000
REFRESH_DESK_IDLE_POLL_MS = 60000
REFRESH_DESK_API_WORKERS = 5

[prod]
# HTTP port for the prod pipeline.
DATAPIPELINE_PORT = 8000
# 1 serves Refresh Desk at /. 0 serves the legacy page at /.
REFRESH_DESK_UI_ENABLED = 1
# 0 keeps prod on the legacy scheduler during the pilot. Set 1 at cutover to send scheduled refreshes to the runner.
CONTENTGEN_RUNNER_ENABLED = 0

[dev]
# HTTP port for the dev pipeline.
DATAPIPELINE_PORT = 8001
# 1 serves Refresh Desk directly on the dev port. Set 0 if dev only needs to serve JSON and the legacy page.
REFRESH_DESK_UI_ENABLED = 1
# 1 sends scheduled dev refreshes to the runner. Dev starts with an empty schedule.
CONTENTGEN_RUNNER_ENABLED = 1
